    const days = Object.keys(s.history).sort().reverse().filter(d => (s.history[d].g || []).length || (s.history[d].a || []).length).slice(0, 14);
    return `<div class="stu" data-i="${i}" data-q="${esc(((p.name || '') + ' ' + (p.username || '') + ' ' + (p.email || '')).toLowerCase())}">
      <div class="stu-h"><b>${esc(p.name || '(tiada nama)')}</b><span class="who">@${esc(p.username || '')} · ${esc(p.email || '')}</span>
        <span class="act ${s.updated && dayStr(s.updated) === today ? 'today' : ''}">${relTime(s.updated)}</span></div>
      <div class="stu-m"><span>Hari ini: <b>${t ? '✓ ' + t.ok.length + ' · ↻ ' + t.re.length : '—'}</b></span>
        <span>Dikuasai: <b>${lv[5]}/${s.pool}</b></span><span>Julat: <b>${s.range.from}–${s.range.to}</b></span>
        <span>Perlu fokus: <b>${s.focus.length}</b></span><span>Jumlah ulang kaji: <b>${s.seen}</b></span></div>
      <div class="lvl-bar">${lv.map((v, k) => v ? `<span style="width:${v / tot * 100}%;background:${LVL_C[k]}" title="${LVL[k]}: ${v}"></span>` : '').join('')}</div>
      <div class="stu-d">
        <h4>Tahap</h4><p class="hint">${lv.map((v, k) => LVL[k] + ' ' + v).join(' · ')}</p>
        ${t ? `<h4>Hari ini · perlu ulang</h4>${rows(t.re)}` : ''}
        <h4>Perlu fokus (terlupa 2 kali atau lebih)</h4>${rows(s.focus, x => 'terlupa ' + x.n + '×')}
        <h4>Sejarah 14 hari</h4>${days.length ? '<ul class="adm-rows">' + days.map(d => `<li><span class="tt">${d}</span><span class="mt">✓ ${(s.history[d].g || []).length} · ↻ ${(s.history[d].a || []).length}</span></li>`).join('') + '</ul>' : '<p class="hint">Tiada sejarah lagi.</p>'}
      </div></div>`;
  };
  panel.innerHTML = `<div class="adm">
    <div class="adm-top"><h2>Papan pentadbir</h2><button id="admRefresh">Muat semula</button><button id="admClose">Tutup</button></div>
    <p class="adm-sub">Data dibaca terus daripada Firebase · ${new Date().toLocaleString('ms-MY')}</p>
    <div class="adm-tiles"><div><b>${students.length}</b>Pelajar berdaftar</div><div><b>${activeToday}</b>Aktif hari ini</div><div><b>${w.activeStudents}</b>Aktif 7 hari</div><div><b>${avgMast}%</b>Purata dikuasai</div></div>
    <div class="adm-sec"><h3>Kelas minggu ini · paling kerap terlupa</h3>
      <p class="hint">${w.from} hingga ${w.to}. Bilangan pelajar yang terlupa setiap falsafah sekurang-kurangnya sekali. Senarai ini dikemas kini setiap kali anda membuka papan ini atau log masuk, dan dipaparkan kepada pelajar dalam tab Progres setiap Jumaat.</p>
      ${rows(w.top, x => x.students + ' pelajar')}</div>
    <div class="adm-sec"><h3>Audio Dr. HALO-N</h3>
      <p class="hint">Hanya pelajar yang log masuk boleh mendengar rakaman ini. Pilih fail MP3 yang dinamakan ikut nombor falsafah (cth. F149.mp3), had 740 KB setiap fail. Fail dengan nombor yang sama akan menggantikan rakaman lama.</p>
      <p class="hint" id="admHalonNow">Ada sekarang: ${(window.FN_HALON && window.FN_HALON.ids.length) ? 'Falsafah ' + window.FN_HALON.ids.join(', ') : 'tiada'}</p>
      <label class="adm-btn" style="display:inline-block">Pilih fail MP3<input type="file" id="admHalon" accept="audio/mpeg,.mp3" multiple hidden></label>
      <p class="acct-msg" id="admHalonMsg" style="text-align:left"></p></div>
    <input class="adm-search" id="admSearch" placeholder="Cari nama, nama pengguna atau emel…">
    <div id="admList">${students.map(card).join('') || '<p class="hint">Belum ada pelajar berdaftar.</p>'}</div>
  </div>`;
  $('admClose').onclick = closeAdmin;
  $('admRefresh').onclick = openAdmin;
  $('admHalon').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    const out = (t, k) => { $('admHalonMsg').textContent = t; $('admHalonMsg').className = 'acct-msg ' + (k || ''); };
    try {
      await user.getIdToken(true);
      const r = await uploadHalon(files, out);
      out((r.done.length ? 'Berjaya: Falsafah ' + r.done.join(', ') + '. ' : '') + (r.bad.length ? 'Tidak dimuat naik: ' + r.bad.join('; ') : ''), r.bad.length ? 'err' : 'ok');
      $('admHalonNow').textContent = 'Ada sekarang: ' + (window.FN_HALON.ids.length ? 'Falsafah ' + window.FN_HALON.ids.join(', ') : 'tiada');
    } catch (err) { out(ERR(err.code || err.message), 'err'); }
  };
  $('admList').onclick = e => { const c = e.target.closest('.stu'); if (c) c.classList.toggle('open'); };
  $('admSearch').oninput = e => { const q = e.target.value.trim().toLowerCase(); panel.querySelectorAll('.stu').forEach(c => { c.style.display = !q || c.dataset.q.includes(q) ? '' : 'none'; }); };
}
function closeAdmin() { panel.classList.remove('active'); document.body.style.overflow = ''; }

document.addEventListener('fn-tour-start', () => {
  if (user && fb) fb.F.setDoc(userDoc(), { tourPending: false }, { merge: true }).catch(() => {});
});

// ---------- start: nothing is usable until the student is signed in ----------
document.getElementById('nameOverlay')?.classList.remove('active');
openSheet('wait');
(async () => {
  if (!CFG) { render(); return; }
  try {
    await loadFb();
    fb.A.onAuthStateChanged(fb.auth, async u => {
      user = u;
      if (!u) { if (!overlay.classList.contains('active') || mode === 'wait') openGate(); setBtn('', 'Log masuk'); return; }
      if (registering) return;   // register() finishes the hand-off itself
      profile = profile || { name: lsGet(KEYS.username) || '', username: lsGet(LAST_USER) || '', email: u.email };
      setBtn('busy', firstName(profile.name));
      try {
        if (await pullMerge(false)) return;   // reloading with merged progress
      } catch (e) { setBtn('', 'Luar talian'); }
      afterLogin();
    });
  } catch (e) {
    card.innerHTML = BRAND + '<h3>Tiada sambungan</h3><p class="sub">Aplikasi perlu internet untuk log masuk kali pertama. Semak sambungan anda, kemudian cuba lagi.</p><button class="namebtn" onclick="location.reload()">Cuba lagi</button>';
  }
})();
</script>
