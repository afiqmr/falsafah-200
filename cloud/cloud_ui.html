<style>
  .acctbtn{
    display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:100px; flex:none;
    background:var(--surface-2); border:1px solid var(--border); color:var(--muted);
    font-family:inherit; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap; max-width:150px;
  }
  .acctbtn span{ overflow:hidden; text-overflow:ellipsis; }
  .acctbtn:hover{ color:var(--ink); border-color:var(--gold); }
  .acctbtn.on{ color:var(--ink); border-color:color-mix(in srgb, var(--emerald) 55%, var(--border)); }
  .acctbtn .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .acctbtn.on .dot{ background:var(--emerald); }
  .acctbtn.busy .dot{ background:var(--gold); animation:acctPulse 1s ease-in-out infinite; }
  @keyframes acctPulse{ 50%{ opacity:.3; } }
  #acctOverlay{ z-index:80; }
  #acctOverlay.gate.active{ background:color-mix(in srgb, var(--bg) 82%, transparent); }
  #acctCard{ text-align:left; max-width:380px; position:relative; isolation:isolate; }
  .fn-sides{ display:none; }
  @media (min-width:800px){
    .fn-sides{ display:block; position:fixed; inset:0; z-index:0; pointer-events:none; }
    .app{ position:relative; z-index:1; }
    .fn-sides i{ position:absolute; inset:0; background-image:var(--page-songket-l, none); background-size:200px 280px; background-position:center top; }
    [data-theme="dark"] .fn-sides i{ background-image:var(--page-songket-d, none); }
    /* clear from the screen edge to about 160px from the content column, then a long, gentle blurred fade into it */
    .fn-sides .sharp{ -webkit-mask-image:linear-gradient(90deg, #000 0, #000 calc(50% - 540px), transparent calc(50% - 390px), transparent calc(50% + 390px), #000 calc(50% + 540px), #000 100%);
      mask-image:linear-gradient(90deg, #000 0, #000 calc(50% - 540px), transparent calc(50% - 390px), transparent calc(50% + 390px), #000 calc(50% + 540px), #000 100%); }
    .fn-sides .soft{ filter:blur(1.6px); opacity:.85;
      -webkit-mask-image:linear-gradient(90deg, transparent calc(50% - 580px), #000 calc(50% - 470px), transparent calc(50% - 380px), transparent calc(50% + 380px), #000 calc(50% + 470px), transparent calc(50% + 580px));
      mask-image:linear-gradient(90deg, transparent calc(50% - 580px), #000 calc(50% - 470px), transparent calc(50% - 380px), transparent calc(50% + 380px), #000 calc(50% + 470px), transparent calc(50% + 580px)); }
  }
  /* songket cloth behind the account menu: gold and red on cream (light), soft gold on charcoal (dark); faint in the middle so text stays clear */
  /* crisp cloth at the card edges; through the middle, where the words are, it turns faint and soft (no boxes) */
  #acctCard::before, #acctCard::after{ content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none;
    background-image:var(--acct-songket-l, none); background-size:160px 224px; background-position:center top; }
  #acctCard::before{ -webkit-mask-image:linear-gradient(90deg, #000 0, rgba(0,0,0,.55) 12%, transparent 30%, transparent 70%, rgba(0,0,0,.55) 88%, #000 100%);
    mask-image:linear-gradient(90deg, #000 0, rgba(0,0,0,.55) 12%, transparent 30%, transparent 70%, rgba(0,0,0,.55) 88%, #000 100%); }
  #acctCard::after{ filter:blur(2.5px); opacity:.45;
    -webkit-mask-image:linear-gradient(90deg, transparent 8%, #000 30%, #000 70%, transparent 92%); mask-image:linear-gradient(90deg, transparent 8%, #000 30%, #000 70%, transparent 92%); }
  [data-theme="dark"] #acctCard::before, [data-theme="dark"] #acctCard::after{ background-image:var(--acct-songket-d, none); }
  #acctCard h3, #acctCard .sub{ text-align:center; }
  #acctCard .brand{ text-align:center; font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 6px; }
  .acct-seg{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:100px; background:var(--surface-2); border:1px solid var(--border); margin:0 0 16px; }
  .acct-seg button{ border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:14px; font-weight:800; padding:9px; border-radius:100px; cursor:pointer; }
  .acct-seg button.active{ background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold); }
  .acct-field{ margin-bottom:10px; }
  .acct-field label{ display:block; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 5px 2px; }
  #acctCard input{ text-align:left; margin-bottom:0; }
  #acctCard input.pin{ letter-spacing:.5em; font-weight:800; text-align:center; font-size:20px; }
  .acct-moved{ font-size:13px; line-height:1.5; color:var(--emerald); background:color-mix(in srgb, var(--emerald) 12%, transparent); border-radius:10px; padding:9px 12px; margin:0 0 12px; text-align:left; }

  .inst-logo{ display:block; width:88px; height:88px; margin:2px auto 10px; filter:drop-shadow(0 6px 16px rgba(0,0,0,.28)); }
  .inst-steps{ list-style:none; margin:4px 0 12px; padding:0; counter-reset:st; }

  .adm-search{ width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:14px; margin:0 0 12px; }

<script type="module">
const CFG = window.FIREBASE_CONFIG;
const KEYS = { srs: 'falsafah200_srs_v1', daily: 'falsafah200_daily_v1', username: 'falsafah200_username_v1', range: 'falsafah200_range_v1', theme: 'falsafah200_theme_v1', history: 'falsafah200_history_v1', streak: 'falsafah200_streak_v1' };
const ADMIN_EMAILS = ['afiqmonsieur@gmail.com'];   // must match the Firestore rules
const isAdminUser = () => !!(user && ADMIN_EMAILS.includes((user.email || '').toLowerCase()));
const SYNCED = new Set(Object.values(KEYS));
const LAST_USER = 'falsafah200_last_user_v1';
const TOUR_KEY = 'falsafah200_tour_pending';   // the welcome tour; also kept in the cloud so the installed app shows it   // remembered on this device so the username is filled in
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const origSet = Storage.prototype.setItem;
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { origSet.call(localStorage, k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const maskEmail = e => { const [u, d] = String(e).split('@'); return (u.length <= 2 ? u[0] + '*' : u.slice(0, 2) + '***') + '@' + (d || ''); };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || 'Akaun';

// ---------- header button ----------
const actions = document.querySelector('.header-actions');
const btn = document.createElement('button');
btn.className = 'acctbtn'; btn.id = 'acctBtn'; btn.type = 'button';
btn.innerHTML = '<i class="dot"></i><span>Log masuk</span>';
actions.insertBefore(btn, actions.firstChild);
function setBtn(state, text) { btn.classList.toggle('on', state === 'on'); btn.classList.toggle('busy', state === 'busy'); btn.querySelector('span').textContent = text; }

// ---------- sheet ----------
const overlay = $('acctOverlay'), card = $('acctCard');
// ---------- songket motif for the account card (same pattern as the moved page) ----------
(function songket() {
  const star = (ex, ey, r) => { const a = Math.abs(ex), b = Math.abs(ey); return (a + b <= r - 2) || (ex === 0 && b <= r) || (ey === 0 && a <= r) || (a === b && a <= r - 1); };
  const even = v => ((v % 2) + 2) % 2 === 0;
  function medallion(dx, dy) {
    const a = Math.abs(dx), b = Math.abs(dy);
    if (a > 14 || b > 21) return 0;
    if (star(dx, dy, 4)) return 2;
    const d = a + b;
    if (d === 6) return 1;
    if (d === 8 && even(dx + dy)) return 1;
    for (const cy of [12, -12]) { const e = a + Math.abs(dy - cy); if (e <= 4 && even(dx + dy)) return 1; if (e === 6) return 1; }
    for (const cy of [18, -18]) if (a + Math.abs(dy - cy) <= 1) return 1;
    if (a === 0 && b === 21) return 1;
    for (const cx of [11, -11]) if (star(dx - cx, dy, 3)) return 2;
    for (const cx of [6, -6]) for (const cy of [9, -9]) { const ex = dx - cx, ey = dy - cy; if (Math.abs(ex) <= 1 && Math.abs(ey) <= 1 && even(ex + ey)) return 1; }
    for (const cx of [12, -12]) for (const cy of [15, -15]) if (Math.abs(dx - cx) + Math.abs(dy - cy) <= 1) return 1;
    return 0;
  }
  function cell(x, y) {
    let best = 0;
    for (const [mx, my] of [[20, 28], [0, 0], [40, 0], [0, 56], [40, 56]]) { const v = medallion(x - mx, y - my); if (v > best) best = v; }
    if (!best) for (const [sx, sy] of [[0, 28], [40, 28], [20, 0], [20, 56]]) if (star(x - sx, y - sy, 3)) best = 2;
    return best;
  }
  function draw(col) {
    const sc = 2, S = 4 * sc, B = sc, PAT = [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]];
    const c = document.createElement('canvas'); c.width = 40 * S; c.height = 56 * S; const g = c.getContext('2d');
    for (let y = 0; y < 56; y++) for (let x = 0; x < 40; x++) { const v = cell(x, y); if (v) { g.fillStyle = col[v]; for (const [px, py] of PAT) g.fillRect(x * S + px * B, y * S + py * B, B, B); } }
    return 'url(' + c.toDataURL() + ')';
  }
  try {
    const r = document.documentElement.style;
    r.setProperty('--acct-songket-l', draw(['', 'rgba(176,128,40,.55)', 'rgba(196,72,48,.6)']));   // gold and songket red on cream
    r.setProperty('--acct-songket-d', draw(['', 'rgba(201,168,92,.42)', 'rgba(226,176,100,.55)']));  // soft gold on charcoal
    r.setProperty('--page-songket-l', draw(['', 'rgba(176,128,40,.25)', 'rgba(196,72,48,.25)']));
    r.setProperty('--page-songket-d', draw(['', 'rgba(201,168,92,.145)', 'rgba(226,176,100,.18)']));
    // the share card (Kongsi) draws this cloth at its top and bottom
    window.FN_SONGKET_BAND = draw(['', 'rgba(176,128,40,.75)', 'rgba(196,72,48,.72)']).slice(4, -1);
    // laptops and desktops: the cloth shows at the left and right of the page, still; it blurs and fades toward the middle column

const halonUrls = {};
function halonUrl(id) {

  const done = [], bad = [];
  for (const f of files) {
    const m = /(\d{1,3})/.exec(f.name || ''), id = m ? +m[1] : 0;
    if (!(id >= 1 && id <= 200)) { bad.push(f.name + ' (tiada nombor falsafah dalam nama fail)'); continue; }
    if (f.size > HALON_MAX) { bad.push(f.name + ' (terlalu besar: ' + Math.round(f.size / 1024) + ' KB, had 740 KB)'); continue; }
    out('Memuat naik ' + f.name + '…');
    await fb.F.setDoc(fb.F.doc(fb.db, 'stats', 'halon-' + id), { data: toBase64(await f.arrayBuffer()), mime: 'audio/mpeg', size: f.size, name: f.name, updatedAt: fb.F.serverTimestamp() });
    delete halonUrls[id];

    Object.keys(h).forEach(d => { if (d >= from && d <= to) { was = true; (h[d].m || []).forEach(id => missed.add(id)); } });

const LVL = ['A+', 'A', 'A−', 'B+', 'B', 'C', 'D', 'G', 'Belum dikaji'];

  let w = Math.min(n - tail, Math.round(n * miss / seen)); if (miss > 0 && !c.box && w < 1) w = 1;

    const pool = DATA.filter(e => e.noEnd >= range.from && e.noStart <= range.to);
    const levels = LVL.map(() => 0); pool.forEach(e => { levels[gredIdx(srs[e.id])]++; });
    const focus = pool.filter(e => { const g = gredIdx(srs[e.id]); return g >= 5 && g <= 7; })   // same rule as the app: gred C, D, G
     .map(e => ({ id: e.id, m: markahOf(srs[e.id]), g: LVL[gredIdx(srs[e.id])] })).sort((a, b) => a.m - b.m);

  if (!user || !fb) return;
  pd.tab = tab || 'tulis';
  if (id && byId(id) && !pd.ids.includes(+id)) pd.ids = [+id].concat(pd.ids).slice(0, PD_MAX);   // opened from a falsafah: it becomes the main one
  pdPanel.classList.add('active'); document.body.style.overflow = 'hidden';
  pdRender();
}
function closePandangan() { pdPanel.classList.remove('active'); document.body.style.overflow = ''; }
function pdRender() {
  const tabs = [['tulis', 'Tulis'], ['saya', 'Pandangan saya'], ['pelajar', 'Pandangan pelajar']];
  pdPanel.innerHTML = `<div class="pd"><div class="adm-top"><h2>Pandangan</h2><button id="pdClose">Tutup</button></div>
    <p class="adm-sub">Kongsi bagaimana ayat dan falsafah ini berkait dengan kehidupan anda, atau dengan ayat lain.</p>
    <div class="pd-tabs" role="tablist">${tabs.map(t => `<button type="button" role="tab" data-t="${t[0]}" class="${pd.tab === t[0] ? 'active' : ''}">${t[1]}</button>`).join('')}</div>
    <div id="pdBody"></div></div>`;
  $('pdClose').onclick = closePandangan;
  pdPanel.querySelectorAll('.pd-tabs button').forEach(b => b.onclick = () => { pdSaveDraft(); pd.tab = b.dataset.t; pdRender(); });
  if (pd.tab === 'tulis') pdWrite(); else if (pd.tab === 'saya') pdMine(); else pdPublic();
}
function pdSaveDraft() { if ($('pdTitle')) pd.title = $('pdTitle').value; if ($('pdText')) pd.text = $('pdText').value; }

function pdWrite(note) {
  const body = $('pdBody');
  body.innerHTML = `
    <div class="pd-field"><label>Pengarang</label><div class="pd-author"><b>${esc(profile?.name || '')}</b> <span>@${esc(profile?.username || '')}</span></div></div>
    <div class="pd-field"><label for="pdTitle">Tajuk</label><input id="pdTitle" class="pd-input" maxlength="${PD_MAX_TITLE}" placeholder="cth. Rezeki datang bersama usaha" value="${esc(pd.title)}"></div>
    <div class="pd-field"><label for="pdFind">Falsafah / ayat yang dikaitkan</label>
      <div class="pd-chips" id="pdChips"></div>
      <input id="pdFind" class="pd-input" autocomplete="off" placeholder="Cari nombor, tajuk atau surah…">
      <ul class="pd-sugg" id="pdSugg" hidden></ul>
      <div class="pd-ayat" id="pdAyat" lang="ar" dir="rtl"></div>
      <p class="pd-count" id="pdIdsNote"></p></div>
    <div class="pd-field"><label for="pdText">Pandangan anda</label>
      <textarea id="pdText" class="pd-input" maxlength="${PD_MAX_TEXT}" placeholder="Terangkan kaitan ayat ini dengan kehidupan anda, atau bagaimana ayat-ayat yang dipilih saling berhubung. Beri contoh.">${esc(pd.text)}</textarea>
      <p class="pd-count" id="pdCount"></p></div>
    <p class="acct-msg ${note ? 'ok' : ''}" id="pdMsg">${note ? esc(note) : ''}</p>
    <button class="pd-send" id="pdSend">Hantar kepada pentadbir</button>
    <p class="acct-note">Pandangan anda dibaca oleh pentadbir dahulu. Hanya yang diterbitkan boleh dibaca pelajar lain, bersama nama penuh anda.</p>`;
  const chips = () => {
    $('pdChips').innerHTML = pd.ids.map((id, k) => { const e = byId(id); return `<span class="pd-chip">${k === 0 ? '<i>Utama</i>' : ''}<span>${e.id} · ${esc(title(e))}</span><button type="button" data-x="${e.id}" aria-label="Buang falsafah ${e.id}">&times;</button></span>`; }).join('');
    const main = byId(pd.ids[0]);
    $('pdAyat').textContent = main ? main.arabic : '';
    $('pdIdsNote').textContent = pd.ids.length ? (pd.ids.length < PD_MAX ? 'Boleh tambah ' + (PD_MAX - pd.ids.length) + ' lagi untuk menunjukkan kaitan antara ayat.' : 'Maksimum ' + PD_MAX + ' falsafah.') : 'Wajib pilih sekurang-kurangnya satu.';
    $('pdFind').hidden = pd.ids.length >= PD_MAX;
    $('pdChips').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { pd.ids = pd.ids.filter(x => x !== +b.dataset.x); chips(); });
  };
  const count = () => { const n = $('pdText').value.trim().length; const c = $('pdCount'); c.textContent = n + ' / ' + PD_MAX_TEXT + ' aksara' + (n < PD_MIN_TEXT ? ' · sekurang-kurangnya ' + PD_MIN_TEXT : ''); c.className = 'pd-count' + (n && n < PD_MIN_TEXT ? ' bad' : ''); };
  const find = () => {
    const q = $('pdFind').value.trim().toLowerCase(), list = $('pdSugg');
    if (!q) { list.hidden = true; return; }
    const num = /^\d+$/.test(q);
    const hits = DATA.filter(e => !pd.ids.includes(e.id) && (num ? String(e.id).startsWith(q) : (e.title.toLowerCase().includes(q) || e.surahDisplay.toLowerCase().includes(q) || e.text.toLowerCase().includes(q)))).slice(0, 8);
    list.innerHTML = hits.length ? hits.map(e => `<li data-id="${e.id}"><b>${e.id}</b>${esc(title(e))}<small>${esc(e.surahDisplay)}</small></li>`).join('') : '<li style="cursor:default;color:var(--muted)">Tiada padanan.</li>';
    list.hidden = false;
    list.querySelectorAll('li[data-id]').forEach(li => li.onclick = () => { pd.ids.push(+li.dataset.id); const m = $('pdMsg'); if (m && m.classList.contains('err')) { m.textContent = ''; m.className = 'acct-msg'; } $('pdFind').value = ''; list.hidden = true; chips(); $('pdFind').focus(); });
  };
  chips(); count();
  const clearMsg = () => { const m = $('pdMsg'); if (m && m.classList.contains('err')) { m.textContent = ''; m.className = 'acct-msg'; } };
  $('pdTitle').oninput = clearMsg;
  $('pdText').oninput = () => { count(); clearMsg(); };
  $('pdFind').oninput = find;
  $('pdFind').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const f = $('pdSugg').querySelector('li[data-id]'); if (f) f.click(); } };
  $('pdSend').onclick = pdSend;
}
async function pdSend() {
  const t = $('pdTitle').value.trim(), x = $('pdText').value.trim(), m = (txt, k) => { $('pdMsg').textContent = txt; $('pdMsg').className = 'acct-msg ' + (k || ''); };
  if (!t) return m('Isi tajuk dahulu.', 'err');
  if (!pd.ids.length) return m('Pilih sekurang-kurangnya satu falsafah atau ayat.', 'err');
  if (x.length < PD_MIN_TEXT) return m('Pandangan terlalu pendek. Tulis sekurang-kurangnya ' + PD_MIN_TEXT + ' aksara.', 'err');
  const b = $('pdSend'); b.disabled = true; m('Menghantar…');
  try {
    // the name and username come from the account record, so no one can post under another name
    const s = await fb.F.getDoc(userDoc()), pr = (s.exists() && s.data().profile) || profile || {};
    await fb.F.addDoc(pdCol(), { uid: user.uid, name: pr.name || '', username: pr.username || '', title: t.slice(0, PD_MAX_TITLE), ids: pd.ids.slice(0, PD_MAX), text: x.slice(0, PD_MAX_TEXT),
      status: 'baru', deleted: false, createdAt: fb.F.serverTimestamp() });
    pd.ids = []; pd.title = ''; pd.text = ''; pd.mine = null;
    pd.tab = 'saya'; pdRender();
    setTimeout(() => { const n = $('pdMineMsg'); if (n) { n.textContent = 'Terima kasih. Pandangan anda sudah dihantar kepada pentadbir.'; n.className = 'acct-msg ok'; } }, 0);
  } catch (e) { b.disabled = false; m(ERR(e.code || e.message), 'err'); }
}

function pdCard(o, opts) {
  const st = o.deleted ? '<span class="pd-status padam">Dipadam pelajar</span>' : `<span class="pd-status ${o.status}">${PD_STATUS[o.status] || o.status}</span>`;
  return `<div class="pd-card" data-id="${o.id}"><h4>${esc(o.title)}</h4>
    <p class="pd-meta">${opts.who ? '<span>oleh <b>' + esc(o.name || '') + '</b>' + (opts.admin ? ' @' + esc(o.username || '') : '') + '</span>' : ''}<span>${pdWhen(o.publishedAt && opts.pub ? o.publishedAt : o.createdAt)}</span>${opts.status ? st : ''}</p>
    ${pdTags(o.ids, opts.pub)}
    <p class="pd-text">${esc(o.text)}</p>
    ${opts.pub ? '<p class="pd-note">Pandangan pelajar, bukan tafsiran pengarang.</p>' : ''}
    ${opts.extra ? opts.extra(o) : ''}</div>`;
}
async function pdMine() {
  const body = $('pdBody');
  body.innerHTML = '<p class="acct-msg" id="pdMineMsg"></p><div id="pdMineList"><div class="acct-spin"></div></div>';
  try {
    if (!pd.mine) pd.mine = (await pdLoad(fb.F.query(pdCol(), fb.F.where('uid', '==', user.uid)))).filter(o => !o.deleted).sort((a, b) => pdTime(b.createdAt) - pdTime(a.createdAt));
    const list = $('pdMineList');
    if (!list) return;
    list.innerHTML = pd.mine.length ? pd.mine.map(o => pdCard(o, { status: true, extra: () => '<button type="button" class="pd-del" data-del="' + o.id + '">Padam</button>' })).join('')
      : '<p class="pd-empty">Anda belum menghantar pandangan. Tekan <b>Tulis</b> untuk mula.</p>';
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Pandangan ini akan disembunyikan daripada anda, tetapi pentadbir masih boleh melihatnya. Padam?')) return;
      try {
        await fb.F.updateDoc(pdDoc(b.dataset.del), { deleted: true, deletedAt: fb.F.serverTimestamp() });
        pd.mine = pd.mine.filter(o => o.id !== b.dataset.del); pd.pub = null; pdMine();
      } catch (e) { const n = $('pdMineMsg'); n.textContent = ERR(e.code || e.message); n.className = 'acct-msg err'; }
    });
  } catch (e) { $('pdMineList').innerHTML = '<p class="pd-empty">' + esc(ERR(e.code || e.message)) + '</p>'; }
}
async function pdPublic() {
  const body = $('pdBody');
  body.innerHTML = '<div id="pdPubList"><div class="acct-spin"></div></div>';
  try {
    if (!pd.pub) pd.pub = (await pdLoad(fb.F.query(pdCol(), fb.F.where('status', '==', 'terbit')))).filter(o => !o.deleted).sort((a, b) => pdTime(b.publishedAt) - pdTime(a.publishedAt));
    const list = $('pdPubList');
    if (!list) return;
    if (!pd.pub.length) { list.innerHTML = '<p class="pd-empty">Belum ada pandangan yang diterbitkan.</p>'; return; }
    const counts = {}; pd.pub.forEach(o => (o.ids || []).forEach(id => { counts[id] = (counts[id] || 0) + 1; }));
    const shown = pd.filter ? pd.pub.filter(o => (o.ids || []).includes(pd.filter)) : pd.pub;
    list.innerHTML = `<div class="pd-filter"><button type="button" class="pd-tag ${pd.filter ? '' : 'on'}" data-f="0">Semua (${pd.pub.length})</button>` +
      Object.keys(counts).map(Number).sort((a, b) => a - b).map(id => `<button type="button" class="pd-tag ${pd.filter === id ? 'on' : ''}" data-f="${id}">F${id} (${counts[id]})</button>`).join('') + '</div>' +
      shown.map(o => pdCard(o, { who: true, pub: true })).join('');
    list.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { pd.filter = +b.dataset.f; pdPublic(); window.scrollTo(0, 0); pdPanel.scrollTop = 0; });
  } catch (e) { $('pdPubList').innerHTML = '<p class="pd-empty">' + esc(ERR(e.code || e.message)) + '</p>'; }
}
// admin: every opinion, newest first; Terbit shows it to all students, Simpan keeps it private
async function adminPandangan(box) {
  let all;
  try { all = (await pdLoad(pdCol())).sort((a, b) => pdTime(b.createdAt) - pdTime(a.createdAt)); }
  catch (e) { box.innerHTML = '<h3>Pandangan pelajar</h3><p class="hint">Tidak dapat dibaca: ' + esc(ERR(e.code || e.message)) + '. Pastikan peraturan Firestore untuk koleksi pandangan sudah ditampal.</p>'; return; }
  let f = all.some(o => o.status === 'baru' && !o.deleted) ? 'baru' : 'semua';
  const draw = () => {
    const nBaru = all.filter(o => o.status === 'baru' && !o.deleted).length;
    const list = all.filter(o => f === 'semua' ? true : f === 'baru' ? (o.status === 'baru' && !o.deleted) : f === 'terbit' ? (o.status === 'terbit' && !o.deleted) : o.deleted);
    box.innerHTML = `<h3>Pandangan pelajar${nBaru ? '<span class="pd-badge">' + nBaru + ' baru</span>' : ''}</h3>
      <p class="hint">Pelajar hanya melihat pandangan yang anda terbitkan, bersama nama penuh penulis. Pandangan yang dipadam pelajar kekal di sini.</p>
      <div class="pd-filter">${[['baru', 'Baru'], ['terbit', 'Diterbitkan'], ['padam', 'Dipadam pelajar'], ['semua', 'Semua (' + all.length + ')']].map(x => `<button type="button" class="pd-tag ${f === x[0] ? 'on' : ''}" data-af="${x[0]}">${x[1]}</button>`).join('')}</div>
      ${list.length ? list.map(o => pdCard(o, { who: true, admin: true, status: true, extra: o => '<div class="pd-actions">' +
        (o.status !== 'terbit' && !o.deleted ? '<button type="button" class="adm-btn" data-pub="' + o.id + '">Terbit</button>' : '') +
        (o.status !== 'simpan' ? '<button type="button" class="adm-btn" data-keep="' + o.id + '">' + (o.status === 'terbit' ? 'Tarik balik' : 'Simpan') + '</button>' : '') + '</div>' })).join('') : '<p class="hint">Tiada.</p>'}`;
    box.querySelectorAll('[data-af]').forEach(b => b.onclick = () => { f = b.dataset.af; draw(); });
    const act = (id, v) => async () => {
      try { await fb.F.updateDoc(pdDoc(id), Object.assign(v, { reviewedAt: fb.F.serverTimestamp() })); const o = all.find(x => x.id === id); Object.assign(o, v, v.status === 'terbit' ? { publishedAt: { toDate: () => new Date() } } : {}); pd.pub = null; draw(); }
      catch (e) { alert(ERR(e.code || e.message)); }
    };
    box.querySelectorAll('[data-pub]').forEach(b => b.onclick = act(b.dataset.pub, { status: 'terbit', publishedAt: fb.F.serverTimestamp() }));
    box.querySelectorAll('[data-keep]').forEach(b => b.onclick = act(b.dataset.keep, { status: 'simpan' }));
  };
  draw();
}
